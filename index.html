<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF8">
  <title>brhndnjf</title>
  <meta name="description" content="Situs pribadi brhndnjf. Sedang disiapkan.">
  <meta property="og:title" content="brhndnjf">
  <meta property="og:description" content="Situs pribadi brhndnjf. Sedang disiapkan.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
  <style>
    :root {
      --paper: #FAFAF8;
      --ink: #14151A;
      --ink-2: #5A6070;
      --line: #E8E8E4;
      --accent: #E4572E;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #101114; --ink: #F2F2EF; --ink-2: #9AA0B0; --line: #26272B; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
      font-family: var(--font); color: var(--ink);
      background: var(--paper); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 34rem; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; }
    h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
    p { margin: 0 0 8px; color: var(--ink-2); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 3px; }
    a:hover { color: var(--accent); }
    small { color: var(--ink-2); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p><span class="dot"></span><small>Sedang disiapkan</small></p>
    <h1>brhndnjf</h1>
    <p>Situs ini masih dibangun. Halaman akan segera tersedia.</p>
    <hr>
    <p><small><a href="https://www.instagram.com/brhndnjf/">Instagram</a></small></p>
  </main>
</body>
</html>

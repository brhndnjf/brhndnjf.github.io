<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">
  <title>Latihan Ujian — brhndnjf</title>
  <meta name="description" content="Materi dan tryout untuk beberapa ujian. Progres tersimpan di perangkat sendiri.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23E4572E'/><text x='50' y='68' font-size='54' font-family='system-ui' font-weight='600' fill='white' text-anchor='middle'>b</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;600&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/materi.css">
  <link rel="stylesheet" href="assets/css/ujian.css">
  <link rel="stylesheet" href="assets/css/hasil.css">

  <!-- Terapkan tema sebelum halaman digambar, supaya tidak berkedip.
       Urutan: pilihan tersimpan, lalu jam setempat (malam 18.00–05.59). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('brh.theme');
        if (t !== 'dark' && t !== 'light') {
          var h = new Date().getHours();
          t = (h >= 18 || h < 6) ? 'dark' : 'light';
        }
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        var hh = new Date().getHours();
        if (hh >= 18 || hh < 6) document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="app">
  <a class="skip" href="#view">Lewati ke konten</a>

  <div class="shell">
    <aside class="side" aria-label="Navigasi aplikasi">
      <a class="side-brand" href="/">
        <span class="side-dot" aria-hidden="true"></span>
        <b>brhndnjf</b>
      </a>
      <div class="side-exam" id="side-exam">Latihan Ujian</div>
      <nav class="side-nav" id="tabs" aria-label="Bagian aplikasi" hidden></nav>
      <div class="side-progress" id="side-progress" aria-label="Ringkasan progres" hidden></div>
    </aside>

    <div class="main">
      <main id="view" tabindex="-1">
        <p class="muted">Memuat…</p>
      </main>

      <footer class="app-foot">
        <span>Progres disimpan di perangkat ini saja. Halaman memuat font dari Google Fonts.</span>
        <span class="app-foot-tools">
          <span class="theme" data-theme-hint>
            <span class="theme-note">
              <span data-theme-state>Tema otomatis</span>
              <span data-theme-time></span>
              <button class="theme-auto" type="button" data-theme-auto hidden>Ikuti jam</button>
            </span>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Ganti tema terang atau gelap" aria-pressed="false">
              <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
              <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
          </span>
          <a href="/">← brhndnjf.github.io</a>
        </span>
      </footer>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/score.js"></script>
  <script src="assets/js/exam.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/sesi.js"></script>
  <script src="assets/js/views/exams.js"></script>
  <script src="assets/js/views/exam.js"></script>
  <script src="assets/js/views/materi.js"></script>
  <script src="assets/js/views/tryout.js"></script>
  <script src="assets/js/views/ujian.js"></script>
  <script src="assets/js/views/hasil.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
